<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharma Vision Inspection</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="dot" id="run-dot"></span>
      <h1 id="line-name">Vision Inspection</h1>
    </div>
    <div class="topbar-right">
      <span class="badge" id="camera-badge">camera: --</span>
      <span class="badge" id="printer-badge">printer: --</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel camera-panel">
      <div class="camera-frame">
        <img id="stream" src="/stream" alt="Live camera feed" />
        <div class="result-banner" id="result-banner">Waiting for inspection data&hellip;</div>
      </div>
      <div class="controls">
        <button id="start-btn" class="btn btn-start">Start</button>
        <button id="stop-btn" class="btn btn-stop">Stop</button>
        <button id="test-reject-btn" class="btn btn-test">Test Reject</button>
      </div>
    </section>

    <section class="panel stats-panel">
      <h2>Line Stats</h2>
      <div class="stat-grid">
        <div class="stat-tile">
          <span class="stat-value" id="stat-inspected">0</span>
          <span class="stat-label">Inspected</span>
        </div>
        <div class="stat-tile pass">
          <span class="stat-value" id="stat-passed">0</span>
          <span class="stat-label">Passed</span>
        </div>
        <div class="stat-tile fail">
          <span class="stat-value" id="stat-rejected">0</span>
          <span class="stat-label">Rejected</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="stat-rate">--%</span>
          <span class="stat-label">Pass rate</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="stat-queue">0</span>
          <span class="stat-label">Reject queue</span>
        </div>
      </div>
    </section>

    <section class="panel rejects-panel">
      <h2>Recent Rejects</h2>
      <div class="rejects-grid" id="rejects-grid">
        <p class="empty-note">No rejects yet.</p>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
