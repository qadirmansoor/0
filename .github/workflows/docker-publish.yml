name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - claude/yo-command-es7dlu
    paths:
      - "Dockerfile"
      - "docker/**"
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erp-zimaos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
